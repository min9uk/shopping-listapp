<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #007aff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 16px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: var(--card-bg);
    color: var(--text);
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
  }
  .add-btn {
    padding: 12px 18px;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  .add-btn:active { opacity: 0.8; }
  .summary {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .checkbox {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--card-bg);
  }
  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-size: 13px;
  }
  .item-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  .item.checked .item-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .delete-btn {
    background: transparent;
    color: var(--danger);
    font-size: 18px;
    padding: 4px 8px;
    line-height: 1;
  }
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 0;
    font-size: 14px;
  }
  .clear-checked {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: var(--card-bg);
    color: var(--danger);
    border: 1px solid var(--border);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #98989d;
      --border: #38383a;
    }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <div class="input-row">
    <input type="text" id="itemInput" placeholder="아이템 입력 후 Enter" autofocus>
    <button class="add-btn" id="addBtn">추가</button>
  </div>
  <div class="summary" id="summary"></div>
  <ul class="list" id="list"></ul>
  <button class="clear-checked" id="clearCheckedBtn" style="display:none;">체크된 항목 모두 삭제</button>
</div>

<script>
  const STORAGE_KEY = 'shopping-list-items';

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = loadItems();

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('itemInput');
  const addBtn = document.getElementById('addBtn');
  const summaryEl = document.getElementById('summary');
  const clearCheckedBtn = document.getElementById('clearCheckedBtn');

  function render() {
    listEl.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '리스트가 비어 있어요. 아이템을 추가해보세요!';
      listEl.appendChild(empty);
      summaryEl.textContent = '';
      clearCheckedBtn.style.display = 'none';
      return;
    }

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item' + (item.checked ? ' checked' : '');

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox' + (item.checked ? ' checked' : '');
      checkbox.textContent = item.checked ? '✓' : '';
      checkbox.addEventListener('click', () => toggleItem(item.id));

      const text = document.createElement('span');
      text.className = 'item-text';
      text.textContent = item.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '×';
      deleteBtn.addEventListener('click', () => deleteItem(item.id));

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(deleteBtn);
      listEl.appendChild(li);
    });

    const checkedCount = items.filter(i => i.checked).length;
    summaryEl.textContent = `총 ${items.length}개 · 완료 ${checkedCount}개`;
    clearCheckedBtn.style.display = checkedCount > 0 ? 'block' : 'none';
  }

  function addItem() {
    const text = inputEl.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, checked: false });
    inputEl.value = '';
    saveItems(items);
    render();
    inputEl.focus();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.checked = !item.checked;
    saveItems(items);
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems(items);
    render();
  }

  function clearChecked() {
    items = items.filter(i => !i.checked);
    saveItems(items);
    render();
  }

  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });
  clearCheckedBtn.addEventListener('click', clearChecked);

  render();
</script>
</body>
</html>
